{{- /* /about/ 已合并进首页 #about：输出真实 301（GitHub Pages 支持目录级 index.html 的 meta refresh），
       并保留 <link rel="canonical"> 以便搜索引擎收敛到首页锚点。 */ -}}
{{- $target := printf "%s#about" site.Home.RelPermalink -}}
<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <meta charset="utf-8" />
    <title>{{ .Title }} → {{ site.Title }}</title>
    <link rel="canonical" href="{{ $target }}" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url={{ $target }}" />
  </head>
  <body>
    <p><a href="{{ $target }}">{{ .Title }}</a></p>
  </body>
</html>
